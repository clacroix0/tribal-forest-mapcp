display_name: Tribal Forest MapCP
description: |-
  Helps Tribal and BIA forestry staff prepare preliminary candidate forest-land
  and cover-type maps for inventory planning and Forest Management Plan
  development. Uses approved public-data mapping tools to inspect inputs,
  produce reviewable GIS layers, summarize acreage, and explain uncertainty,
  provenance, and quality checks.

  Replacing the blank map—not the forester.
